general:
  use_uvloop: true

functions:
  pdf_file_ingest_tool:
    _type: pdf_file_ingest_tool
    ingest_glob: "examples/documentation_guides/workflows/text_file_ingest/data/*.txt"
    description: "Search for information about DOCA and GPUNetIO. For any questions about DOCA and GPUNetIO, you must use this tool!"
    embedder_name: nv-embedqa-e5-v5
    chunk_size: 512
  compliance_checker_tool:
    _type: compliance_checker_tool

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-4-maverick-17b-128e-instruct
    temperature: 0.0
    max_tokens: 1024

workflow:
  _type: react_agent
  tool_names:
    - compliance_checker_tool
    - pdf_file_ingest_tool
  llm_name: nim_llm
  verbose: true
  retry_parsing_errors: true
  max_retries: 3
